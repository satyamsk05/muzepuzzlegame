<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2eafc" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Ruler Body -->
  <rect x="56" y="140" width="400" height="232" rx="28" fill="url(#rulerGrad)" stroke="#4cc9f0" stroke-width="6"/>
  
  <!-- Measurement ticks along top -->
  <line x1="86" y1="140" x2="86" y2="175" stroke="#3f37c9" stroke-width="4"/>
  <line x1="126" y1="140" x2="126" y2="162" stroke="#4895ef" stroke-width="3"/>
  <line x1="166" y1="140" x2="166" y2="175" stroke="#3f37c9" stroke-width="4"/>
  <line x1="206" y1="140" x2="206" y2="162" stroke="#4895ef" stroke-width="3"/>
  <line x1="246" y1="140" x2="246" y2="175" stroke="#3f37c9" stroke-width="4"/>
  <line x1="286" y1="140" x2="286" y2="162" stroke="#4895ef" stroke-width="3"/>
  <line x1="326" y1="140" x2="326" y2="175" stroke="#3f37c9" stroke-width="4"/>
  <line x1="366" y1="140" x2="366" y2="162" stroke="#4895ef" stroke-width="3"/>
  <line x1="406" y1="140" x2="406" y2="175" stroke="#3f37c9" stroke-width="4"/>

  <!-- Ruler sliding puzzle tiles inside (3x5 grid preview) -->
  <g transform="translate(86, 195)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="60" height="45" rx="6" fill="#f72585" stroke="#ffffff" stroke-width="2"/>
    <rect x="68" y="0" width="60" height="45" rx="6" fill="#b5179e" stroke="#ffffff" stroke-width="2"/>
    <rect x="136" y="0" width="60" height="45" rx="6" fill="#7209b7" stroke="#ffffff" stroke-width="2"/>
    <rect x="204" y="0" width="60" height="45" rx="6" fill="#560bad" stroke="#ffffff" stroke-width="2"/>
    <rect x="272" y="0" width="60" height="45" rx="6" fill="#480ca8" stroke="#ffffff" stroke-width="2"/>

    <!-- Row 1 -->
    <rect x="0" y="52" width="60" height="45" rx="6" fill="#3f37c9" stroke="#ffffff" stroke-width="2"/>
    <rect x="68" y="52" width="60" height="45" rx="6" fill="#4361ee" stroke="#ffffff" stroke-width="2"/>
    <rect x="136" y="52" width="60" height="45" rx="6" fill="#4895ef" stroke="#ffffff" stroke-width="2"/>
    <rect x="204" y="52" width="60" height="45" rx="6" fill="#4cc9f0" stroke="#ffffff" stroke-width="2"/>
    <rect x="272" y="52" width="60" height="45" rx="6" fill="#2ec4b6" stroke="#ffffff" stroke-width="2"/>

    <!-- Row 2 -->
    <rect x="0" y="104" width="60" height="45" rx="6" fill="#ffb703" stroke="#ffffff" stroke-width="2"/>
    <rect x="68" y="104" width="60" height="45" rx="6" fill="#fb8500" stroke="#ffffff" stroke-width="2"/>
    <rect x="136" y="104" width="60" height="45" rx="6" fill="#d90429" stroke="#ffffff" stroke-width="2"/>
    <rect x="204" y="104" width="60" height="45" rx="6" fill="#ef233c" stroke="#ffffff" stroke-width="2"/>
    <!-- Empty space at bottom right -->
    <rect x="272" y="104" width="60" height="45" rx="6" fill="#2b2d42" opacity="0.4" stroke="#ffffff" stroke-dasharray="4 4" stroke-width="2"/>
  </g>
</svg>
